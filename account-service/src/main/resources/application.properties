spring.application.name=account-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/account_db}
spring.datasource.username=${DB_USERNAME:bank_dev}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable database access during view rendering
spring.jpa.open-in-view=false
# Application logs
logging.level.com.myproyect.account_service=INFO

# Required trusted authorization server settings; no development trust defaults.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE}
